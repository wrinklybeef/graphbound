[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "graphbound"
version = "0.1.0"
description = "A small, bounded, host-pinned transport for Microsoft Graph."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Adam Wallace" }]
requires-python = ">=3.11"
dependencies = ["requests>=2.31"]
keywords = ["microsoft-graph", "microsoft-365", "entra", "retry", "msp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff==0.16.8",
    "mypy~=2.3",
    # requests ships its own type hints from this version, which mypy needs.
    "requests>=2.34.2",
]

[project.urls]
Repository = "https://github.com/wrinklybeef/graphbound"
Issues = "https://github.com/wrinklybeef/graphbound/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
graphbound = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "PT", "RUF"]

[tool.mypy]
strict = true
files = ["src"]
